
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Registration | CloudFood</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">Cloud<span>Food</span></div>
    <nav>
        <a href="./index.html">Home</a>
        <a href="./login.html">Owner Login</a>
    </nav>
</header>

<main>
    <section class="registration-container">
        <h1>Register Your Restaurant</h1>
        <p>Join CloudFood and manage your restaurant online.</p>

        <form id="register-form">
            <label for="full_name">Owner Name</label>
            <input id="full_name" name="full_name" type="text" required minlength="2">

            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="8">

            <label for="restaurant_name">Restaurant Name</label>
            <input id="restaurant_name" name="restaurant_name" type="text" required>

            <label for="cuisine">Cuisine</label>
            <input id="cuisine" name="cuisine" type="text" placeholder="e.g. Indian" required>

            <button type="submit" class="checkout-button">
                Register Restaurant
            </button>

            <p id="register-message" role="status"></p>
        </form>

        <p>Already registered? <a href="./login.html">Login here</a></p>
    </section>
</main>

<script src="./register.js" defer></script>
</body>
</html>
