
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Login | CloudFood</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">Cloud<span>Food</span></div>
    <nav>
        <a href="./index.html">Home</a>
        <a href="./register.html">Register Restaurant</a>
    </nav>
</header>

<main>
    <section class="registration-container">
        <h1>Restaurant Owner Login</h1>
        <p>Access your CloudFood restaurant dashboard.</p>

        <form id="login-form">
            <label for="email">Email Address</label>
            <input
                id="email"
                name="email"
                type="email"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                required
            >

            <button type="submit" class="checkout-button">
                Login
            </button>

            <p id="login-message" role="status"></p>
        </form>

        <p>
            New to CloudFood?
            <a href="./register.html">Register your restaurant</a>
        </p>
    </section>
</main>

<script src="./login.js" defer></script>
</body>
</html>
